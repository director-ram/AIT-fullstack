{% extends "base.html" %}

{% block title %}{{ username }} | Monthly Moments{% endblock %}

{% block body %}
    <section class="profile-panel">
        <div class="avatar" aria-hidden="true">{{ username|first|upper }}</div>
        <p class="eyebrow">Member profile</p>
        <h1>Welcome, {{ username }}.</h1>
        <p class="profile-copy">Your place for discovering a fresh monthly challenge.</p>
        <a class="back-link" href="{% url 'home' %}">Explore the months &#8594;</a>
    </section>
{% endblock %}

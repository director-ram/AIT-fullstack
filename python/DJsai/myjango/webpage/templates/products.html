{% extends "base.html" %}

{%block title %}Products {%endblock%}


{%block body%}

<h1>Products</h1>

    {% for product in products %}
        <div class="container my-4 bg-dark text-light p-4 rounded border border-3 shadow border-primary">
            <h2 class="my-4">{{ product.title }}</h2>
            <b class="my-5"><mark class="rounded border-0 p-2 my-3">Price: {{ product.price }}</mark></b>
            <br><br>
            <p>Description:{{ product.description}}</p>
        </div>
    {% empty %}
        <p>No products found.</p>
    {% endfor %}
{%endblock%}
